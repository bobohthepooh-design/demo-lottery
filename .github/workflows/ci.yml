name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lottery
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: lottery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lottery -d lottery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install server deps
        run: npm ci --prefix server
      - name: Server tests (unit + API against postgres)
        env:
          TEST_DATABASE_URL: postgres://lottery:ci-test-password@127.0.0.1:5432/lottery_test
        run: npm --prefix server test
      - name: Install client deps
        run: npm ci --prefix client
      - name: Client unit tests (vitest)
        run: npm --prefix client test
      - name: Client build
        run: npm --prefix client run build
      - name: Dependency audit (server)
        run: npm --prefix server audit --audit-level=high
      - name: Dependency audit (client)
        run: npm --prefix client audit --audit-level=high
      - name: Dependency audit (root)
        run: npm audit --audit-level=high

  # ---------- E2E smoke: server จริง + postgres service จริง ----------
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lottery
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: lottery_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lottery -d lottery_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install server deps
        run: npm ci --prefix server
      - name: Start server (auto migrate + seed)
        env:
          DATABASE_URL: postgres://lottery:ci-test-password@127.0.0.1:5432/lottery_e2e
          PORT: '4000'
          SESSION_SECRET: ci-e2e-session-secret-not-for-prod
          HIBP_CHECK: 'false'
          # เครดิตสูงพอสำหรับ scratch(5000)+hilo+kiwi+bets ใน smoke เดียว
          INITIAL_CREDIT: '100000'
          # บังคับ demo wallet mode — smoke ทดสอบ /bets/wallet/action
          # (ถ้า .env หลุดเข้ามาจะได้ 403 USE_PAYMENTS แทน)
          PROMPTPAY_ID: ''
        run: npm --prefix server start &
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 1
          done
          echo "server did not become healthy"; exit 1
      - name: Smoke test (register→play→wallet guards)
        env:
          BASE_URL: http://localhost:4000
        run: node tests/smoke.mjs

  # ---------- SBOM (Software Bill of Materials) ----------
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (syft → SPDX JSON)
        run: |
          docker run --rm -v "$PWD:/src" -w /src anchore/syft:v1.23.0 \
            dir:/src -o spdx-json=sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30

  # ---------- Security scanning (DevSecOps) ----------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full git history for leaked secrets
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST (ERROR severity gate)
        run: semgrep scan --config p/javascript --config p/typescript --config p/nodejs --config p/owasp-top-ten --config p/secrets --severity ERROR --error server/src client/src scripts tests

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ใช้ docker image ตรงๆ แทน trivy-action — action บน GH runner ล้มที่ "Set up job"
      # (ดาวน์โหลด trivy DB โดน rate limit) ส่วน image pull ผ่าน docker hub ปกติ
      - name: Trivy filesystem scan (vuln+secret)
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.58.2 \
            fs --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            --scanners vuln,secret .
      - name: Trivy IaC config scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.58.2 \
            config --severity CRITICAL,HIGH --exit-code 1 .
