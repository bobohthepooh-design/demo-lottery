<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- พื้นหลังสี่เหลี่ยมมนโทน navy -->
  <rect width="64" height="64" rx="14" fill="#0a1526"/>
  <!-- วงแหวนทองคู่แบบตราราชการ/สลาก -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#f5c518" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#b8860b" stroke-width="1" opacity="0.7"/>
  <circle cx="32" cy="32" r="21.5" fill="#0f1e33"/>
  <!-- ดาวทองเล็กด้านบน (สัญลักษณ์กลางตรา) -->
  <path d="M32 13.5l1.8 3.9 4.2.5-3.1 2.9.8 4.2-3.7-2.1-3.7 2.1.8-4.2-3.1-2.9 4.2-.5z" fill="#f5c518"/>
  <!-- ลูกบอลหวย 3 ลูก ซ้อนกันกลางตรา -->
  <g>
    <!-- ลูกซ้าย (ฟ้า) -->
    <circle cx="24.5" cy="36" r="8.5" fill="#38bdf8"/>
    <circle cx="24.5" cy="36" r="8.5" fill="none" stroke="#0a1526" stroke-width="1" opacity="0.35"/>
    <circle cx="22" cy="33" r="2.6" fill="#ffffff" opacity="0.55"/>
    <!-- ลูกขวา (ทอง) -->
    <circle cx="39.5" cy="36" r="8.5" fill="#f5c518"/>
    <circle cx="39.5" cy="36" r="8.5" fill="none" stroke="#0a1526" stroke-width="1" opacity="0.35"/>
    <circle cx="37" cy="33" r="2.6" fill="#ffffff" opacity="0.55"/>
    <!-- ลูกกลางล่าง (ขาว/ชมพู) ทับหน้า -->
    <circle cx="32" cy="41" r="8.5" fill="#f8fafc"/>
    <circle cx="32" cy="41" r="8.5" fill="none" stroke="#0a1526" stroke-width="1" opacity="0.35"/>
    <circle cx="29.5" cy="38" r="2.6" fill="#ffffff" opacity="0.8"/>
    <text x="32" y="44.5" font-size="7" text-anchor="middle" fill="#0a1526" font-family="Arial, Helvetica, sans-serif" font-weight="bold">1</text>
  </g>
