<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- พื้นหลังสี่เหลี่ยมมนโทน navy -->
  <rect width="64" height="64" rx="14" fill="#0a1526"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#f5c518" stroke-width="3" opacity="0.9"/>
  <!-- เหรียญทอง -->
  <circle cx="32" cy="32" r="21" fill="#f5c518"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#b8860b" stroke-width="2"/>
  <!-- ขอบเหรียญแบบ ridged -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="#d9a520" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="14.5" fill="#0a1526"/>
  <!-- สัญลักษณ์บาท -->
  <text x="32" y="41.5" font-size="21" text-anchor="middle" fill="#f5c518" font-family="Arial, Helvetica, sans-serif" font-weight="bold">฿</text>
</svg>
