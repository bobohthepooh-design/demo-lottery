<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16294d"/>
      <stop offset="100%" stop-color="#0a1526"/>
    </radialGradient>
    <radialGradient id="ballR" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ff7a6e"/>
      <stop offset="55%" stop-color="#e5322d"/>
      <stop offset="100%" stop-color="#a3121a"/>
    </radialGradient>
    <radialGradient id="ballG" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="55%" stop-color="#f5b921"/>
      <stop offset="100%" stop-color="#c98a0a"/>
    </radialGradient>
    <radialGradient id="ballB" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7cc4ff"/>
      <stop offset="55%" stop-color="#2f8fe0"/>
      <stop offset="100%" stop-color="#17548f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="50%" stop-color="#e8b62a"/>
      <stop offset="100%" stop-color="#9a6d10"/>
    </linearGradient>
  </defs>

  <!-- พื้นหลังวงกลม + กรอบทอง -->
  <circle cx="60" cy="60" r="57" fill="url(#bg)" stroke="url(#ring)" stroke-width="5"/>
  <circle cx="60" cy="60" r="51" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- ลูกบอลแดง (7) — หลังซ้าย -->
  <g>
    <circle cx="40" cy="72" r="17" fill="url(#ballR)"/>
    <ellipse cx="34" cy="66" rx="6" ry="4" fill="#ffffff" opacity="0.55" transform="rotate(-25 34 66)"/>
    <text x="40" y="78" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="17" fill="#ffffff">7</text>
  </g>

  <!-- ลูกบอลทอง (ดาว) — กลาง หน้าสุด -->
  <g>
    <circle cx="60" cy="56" r="21" fill="url(#ballG)"/>
    <ellipse cx="53" cy="48" rx="7" ry="4.5" fill="#ffffff" opacity="0.6" transform="rotate(-25 53 48)"/>
    <path d="M60 45l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="#8a5a00"/>
  </g>

  <!-- ลูกบอลน้ำเงิน (3) — หลังขวา -->
  <g>
    <circle cx="82" cy="74" r="15" fill="url(#ballB)"/>
    <ellipse cx="77" cy="69" rx="5" ry="3.4" fill="#ffffff" opacity="0.55" transform="rotate(-25 77 69)"/>
    <text x="82" y="79.5" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" fill="#ffffff">3</text>
  </g>

  <!-- ประกายดาว -->
  <g fill="#ffe9a8">
    <path d="M30 26l1.8 4 4.2.5-3.1 2.9.8 4.1-3.7-2-3.7 2 .8-4.1-3.1-2.9 4.2-.5z"/>
    <path d="M92 24l1.4 3.2 3.4.4-2.5 2.3.6 3.3-3-1.6-3 1.6.6-3.3-2.5-2.3 3.4-.4z"/>
    <path d="M98 44l1 2.3 2.4.3-1.8 1.7.4 2.4-2.1-1.1-2.1 1.1.4-2.4-1.8-1.7 2.4-.3z"/>
  </g>
  <circle cx="24" cy="46" r="2" fill="#7cc4ff" opacity="0.9"/>
  <circle cx="100" cy="52" r="2.4" fill="#ff8f7a" opacity="0.9"/>
</svg>
